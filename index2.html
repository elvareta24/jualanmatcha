<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchaKu — Premium Japanese Matcha</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --green: #0b8f55;
      --dark-green: #076b40;
      --light-green: #e9f8ef;
      --cream: #fffaf0;
      --dark: #19352a;
      --gray: #777;
    }

    body {
      background: var(--cream);
      color: var(--dark);
    }

    /* NAVBAR */
    nav {
      height: 70px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: var(--green);
    }

    .logo span {
      color: var(--dark);
    }

    nav ul {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    nav a {
      text-decoration: none;
      color: var(--dark);
      font-weight: 600;
    }

    .cart-button {
      background: var(--green);
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    /* HERO */
    .hero {
      min-height: 570px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 60px 8%;
      background:
        radial-gradient(circle at 80% 40%, #c9efd7, transparent 35%),
        var(--cream);
    }

    .hero-text h1 {
      font-size: clamp(45px, 6vw, 78px);
      line-height: .95;
      margin-bottom: 25px;
    }

    .hero-text h1 span {
      color: var(--green);
    }

    .hero-text p {
      color: var(--gray);
      max-width: 500px;
      line-height: 1.7;
      margin-bottom: 30px;
      font-size: 17px;
    }

    .hero-btn {
      background: var(--green);
      color: white;
      border: none;
      padding: 15px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .hero-btn:hover {
      background: var(--dark-green);
      transform: translateY(-2px);
    }

    .hero-image {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image img {
      width: min(480px, 90%);
      height: 480px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 25px 60px rgba(0,0,0,.18);
    }

    /* PRODUCTS */
    .products {
      padding: 80px 8%;
      background: white;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: var(--gray);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    .product {
      background: #fff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
      transition: .25s;
    }

    .product:hover {
      transform: translateY(-7px);
      box-shadow: 0 15px 35px rgba(0,0,0,.12);
    }

    .product-img {
      height: 250px;
      overflow: hidden;
      background: #dff2e5;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .product-info p {
      color: var(--gray);
      font-size: 14px;
      line-height: 1.5;
      min-height: 42px;
    }

    .price {
      color: var(--green);
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--light-green);
      color: var(--green);
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:hover {
      background: var(--green);
      color: white;
    }

    /* PROMO */
    .promo {
      margin: 70px 8%;
      background: var(--green);
      color: white;
      border-radius: 30px;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .promo h2 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .promo p {
      opacity: .9;
    }

    .promo button {
      background: white;
      color: var(--green);
      border: none;
      padding: 15px 25px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    /* CHECKOUT */
    .checkout {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .checkout.active {
      display: flex;
    }

    .checkout-box {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 30px 30px 0 0;
      padding: 30px;
      animation: slideUp .3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    .checkout-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .close {
      border: none;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .qty button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: var(--light-green);
      color: var(--green);
      cursor: pointer;
      font-weight: bold;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: bold;
      padding: 20px 0;
    }

    /* PAYMENT */
    .payment-title {
      margin: 20px 0 12px;
    }

    .payment-option {
      border: 2px solid #eee;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: .2s;
    }

    .payment-option:hover,
    .payment-option.selected {
      border-color: var(--green);
      background: var(--light-green);
    }

    .payment-icon {
      font-size: 25px;
    }

    .pay-button {
      width: 100%;
      padding: 16px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    /* FOOTER */
    footer {
      background: var(--dark);
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    footer p {
      opacity: .7;
      margin-top: 8px;
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero-text p {
        margin-left: auto;
        margin-right: auto;
      }

      .hero-image {
        margin-top: 40px;
      }

      nav ul {
        display: none;
      }
    }

    @media (max-width: 550px) {
      .product-grid {
        grid-template-columns: 1fr;
      }

      .promo {
        flex-direction: column;
        text-align: center;
        padding: 35px 25px;
      }

      .hero-image img {
        height: 330px;
      }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">Matcha<span>Ku</span> 🍵</div>

  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#produk">Produk</a></li>
    <li><a href="#promo">Promo</a></li>
  </ul>

  <button class="cart-button" onclick="openCheckout()">
    🛒 Keranjang (<span id="cartCount">0</span>)
  </button>
</nav>

<section class="hero" id="home">

  <div class="hero-image">

    <img

  </div>

</section>

             alt="Classic Matcha">
      </div>

      <div class="product-info">
        <h3>Classic Matcha</h3>
        <p>Matcha premium dengan rasa earthy
