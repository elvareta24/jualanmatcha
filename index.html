<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcha-Jek | Pesan Antar Matcha</title>
    <style>
        /* Pengaturan Dasar & Gaya Mobile */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px; /* Ukuran layar HP */
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px; /* Ruang untuk tombol keranjang */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Bagian Header (Warna Hijau ala Gojek/Matcha) */
        .header {
            background-color: #00aa13;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Banner Promo */
        .promo-banner {
            background-color: #e8fceb;
            color: #00aa13;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #d4ebd7;
        }

        /* Daftar Menu */
        .menu-list {
            padding: 20px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eeeeee;
        }
        .menu-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #333;
        }
        .menu-info p {
            margin: 0;
            font-size: 14px;
            color: #777;
        }
        .menu-price {
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        /* Tombol Tambah */
        .add-btn {
            background-color: white;
            color: #00aa13;
            border: 1px solid #00aa13;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-btn:hover {
            background-color: #00aa13;
            color: white;
        }

        /* Tombol Keranjang (Bottom Bar) */
        .cart-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: #00aa13;
            color: white;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            display: none; /* Sembunyikan jika kosong */
        }
